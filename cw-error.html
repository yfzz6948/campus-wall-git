<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>暂时访问不了 · 深three职网页墙</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #ededed; color: #333;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  .card {
    background: #fff; border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.06);
    max-width: 420px; width: 100%; padding: 36px 28px 30px; text-align: center;
  }
  .code { font-size: 2.2rem; font-weight: 600; color: #bbb; line-height: 1; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 14px 0 10px; }
  p { font-size: .88rem; color: #777; line-height: 1.6; margin: 0 0 22px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; text-decoration: none; border-radius: 10px;
    padding: 9px 22px; font-size: .88rem; font-weight: 500; cursor: pointer;
  }
  .primary { background: #ffc107; color: #212529; }
  .ghost { background: #fff; color: #333; border: 1px solid #ddd; }
  .tip { margin-top: 24px; font-size: .72rem; color: #aaa; }
</style>
</head>
<body>
  <div class="card">
    <div class="code">:(</div>
    <h1>这会儿访问不了</h1>
    <p>可能是正在重启、临时维护，或者你提交的内容太大。<br>等十几秒再试一次通常就好了。</p>
    <div class="btns">
      <a class="btn primary" href="/">返回首页</a>
      <a class="btn ghost" href="javascript:location.reload()">重新加载</a>
    </div>
    <div class="tip">如果一直这样，可以在「隐私政策及社区准则」页找到联系方式告诉站长。</div>
  </div>
</body>
</html>
