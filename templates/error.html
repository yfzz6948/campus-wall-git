{% extends "base.html" %}
{% block title %}{{ error_code }} · {{ error_title }}{% endblock %}

{% block content %}
<div class="app-container px-3">
  <div class="card post-card rounded-4 mt-5">
    <div class="card-body text-center py-5 px-4">
      <div class="text-muted" style="font-size:2.4rem;line-height:1;font-weight:600;opacity:.35;">
        {{ error_code }}
      </div>
      <h5 class="mt-3 mb-2">{{ error_title }}</h5>
      <p class="text-muted small mb-4" style="white-space:pre-line;">{{ error_msg }}</p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('index') }}" class="btn btn-wechat px-4">返回首页</a>
        <button type="button" class="btn btn-light border px-4" id="cw-error-reload">重新加载</button>
      </div>
      <div class="text-muted mt-4" style="font-size:.72rem;opacity:.6;">
        {{ app_version }} · 构建号 {{ build }}
      </div>
    </div>
  </div>
  <div class="text-center text-muted small mt-3">
    如果反复出现，可以在「隐私政策及社区准则」页找到联系方式告诉站长。
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById('cw-error-reload').addEventListener('click', () => {
    location.reload();
  });
</script>
{% endblock %}
