{% extends "base.html" %}
{% block title %}即将离开本站 · three职校园墙{% endblock %}

{% block content %}
<main class="app-container px-3 py-4">
  <div class="card rounded-4 border-0" style="box-shadow:0 1px 2px rgba(0,0,0,.06);">
    <div class="card-body p-4">

      <div class="text-center mb-3">
        <div class="fs-1 lh-1 mb-2">↗</div>
        <h1 class="fs-5 fw-semibold mb-1">您即将访问站外页面</h1>
        <div class="text-muted small">这个页面不属于 three职校园墙</div>
      </div>

      <div class="rounded-3 bg-light p-3 mb-3">
        <div class="small text-muted mb-1">目标站点</div>
        <div class="fw-semibold" style="word-break:break-all;">{{ site }}</div>
        <div class="text-muted mt-2" style="font-size:.75rem;word-break:break-all;">{{ target }}</div>
      </div>

      <div class="alert alert-warning py-2 small mb-3">
        该页面的内容与本站无关，本站不对其负责。请不要在那边输入学号、姓名、密码等个人信息。
      </div>

      <div class="d-flex gap-2">
        <a class="btn btn-wechat flex-grow-1"
           href="{{ target }}" rel="noreferrer noopener">继续访问</a>
        <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">返回首页</a>
      </div>

    </div>
  </div>
</main>
{% endblock %}
