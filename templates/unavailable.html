{% extends "base.html" %}
{% block title %}服务暂时不可用 · three职校园墙{% endblock %}

{% block content %}
<div class="app-container px-3 pt-4 pb-1">
    <div class="card rounded-4 border-0 shadow-sm w-100 text-center" style="max-width:400px;margin:0 auto;">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-2">服务暂时不可用</h5>
            <p class="text-muted small mb-3">
                数据库连接失败，页面暂时打不开。<br>
                通常是服务器维护或网络抖动，稍等一会儿再试即可。
            </p>
            <a class="btn btn-wechat w-100 py-2" href="{{ url_for('index') }}">重新加载</a>
            <p class="text-muted mt-3 mb-0" style="font-size:.75rem;">
                如果长时间无法访问，请联系网站管理员。
            </p>
        </div>
    </div>
</div>
{% endblock %}
